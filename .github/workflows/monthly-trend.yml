name: Aylik Sifir Arac Fiyat Trendi
on:
  schedule:
    - cron: "0 8 3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monthly-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: python monthly_trend.py
      - name: Yönetici aylık trend e-postası
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python send_monthly_email.py
      - uses: actions/upload-artifact@v7
        with:
          name: aylik-fiyat-trendi-${{ github.run_id }}
          path: v2_output/reports/monthly_trend.*
          retention-days: 365
